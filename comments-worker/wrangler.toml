# Cloudflare Worker that stores blog comments for adamu.tech (free tier).
# Deployed by .github/workflows/comments-worker.yml, which fills in
# database_id and sets the ADMIN_KEY secret.
name = "adamu-comments"
main = "src/index.js"
compatibility_date = "2026-09-01"

# adamu.tech is on Cloudflare, so the service answers on the site's own domain
# (https://adamu.tech/api/...). These paths only exist on Cloudflare's
# edge; the rest of the site is untouched. Requires the adamu.tech DNS record
# to be proxied (orange cloud) in Cloudflare.
workers_dev = false
routes = [{ pattern = "adamu.tech/api/*", zone_name = "adamu.tech" }]

[vars]
ALLOWED_ORIGINS = "https://adamu.tech,https://www.adamu.tech"

[[d1_databases]]
binding = "DB"
database_name = "adamu-comments"
database_id = "REPLACED_BY_WORKFLOW"
