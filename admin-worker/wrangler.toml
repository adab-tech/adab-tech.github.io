# Cloudflare Worker behind adamu.tech/admin (free tier).
# Sign-in uses a site password. The Worker uses its own GitHub credentials
# to publish changes to the repository. See docs/ADMIN.md for setup.
name = "adamu-admin"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Answers only under https://adamu.tech/api/admin/... (the rest of the site is
# untouched). Needs the adamu.tech DNS record proxied (orange cloud).
workers_dev = false
routes = [{ pattern = "adamu.tech/api/admin/*", zone_name = "adamu.tech" }]

[vars]
REPO = "adab-tech/adab-tech.github.io"
ANALYTICS_ZONE_ID = "c79da83c86c986fcdd5e686c129e4d84"

[[ratelimits]]
name = "LOGIN_RATE_LIMIT"
namespace_id = "2026112301"

  [ratelimits.simple]
  limit = 5
  period = 60
