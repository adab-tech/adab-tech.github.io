name: Deploy admin server

# Deploys the password sign-in Worker to adamu.tech/api/admin.
# See docs/ADMIN.md for required and optional secrets.
on:
  push:
    branches: ["main"]
    paths: ["admin-worker/**", ".github/workflows/admin-worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
      GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
      GITHUB_APP_INSTALLATION_ID: ${{ secrets.GITHUB_APP_INSTALLATION_ID }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
      WRANGLER: npx --yes wrangler@4
    defaults:
      run:
        working-directory: admin-worker
    steps:
      - name: Check secrets
        id: secrets
        working-directory: .
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ADMIN_PASSWORD ADMIN_SESSION_SECRET; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::notice::Admin server not deployed; missing secrets:$missing (see docs/ADMIN.md, Admin server)."
            echo "Admin Worker deployment skipped. Add these repository secrets first:$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: "22"

      - name: Verify admin sessions and publishing
        if: steps.secrets.outputs.ready == 'true'
        run: node --test test/auth.test.mjs

      - name: Deploy the Worker with its secrets
        if: steps.secrets.outputs.ready == 'true'
        run: |
          umask 077
          worker_secrets=$(mktemp)
          trap 'rm -f "$worker_secrets"' EXIT
          node --input-type=module - "$worker_secrets" <<'JS'
          import { writeFileSync } from 'node:fs'
          const names = [
            'ADMIN_PASSWORD', 'ADMIN_SESSION_SECRET',
            'GITHUB_APP_ID', 'GITHUB_APP_INSTALLATION_ID', 'GITHUB_APP_PRIVATE_KEY',
          ]
          const secrets = Object.fromEntries(names.filter((name) => process.env[name]).map((name) => [name, process.env[name]]))
          if (process.env.ADMIN_GITHUB_TOKEN) secrets.GITHUB_TOKEN = process.env.ADMIN_GITHUB_TOKEN
          writeFileSync(process.argv[2], JSON.stringify(secrets))
          JS
          $WRANGLER deploy --secrets-file "$worker_secrets"

      - name: Check it answers
        if: steps.secrets.outputs.ready == 'true'
        working-directory: .
        run: |
          sleep 10
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 15 https://adamu.tech/api/admin/session | jq -e '.signedIn == false' >/dev/null; then
              echo "Admin server is live. Sign in at https://adamu.tech/admin/ with the admin password." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The deployed admin Worker did not return the expected session response. Check its route, DNS proxy status, and secret settings."
          exit 1
